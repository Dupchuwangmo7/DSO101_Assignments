name: CI/CD Pipeline

# Trigger the workflow on every push and pull request to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────
  # Job 1 — Build and Test
  # Runs on every push and pull-request to main
  # ──────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest test_app.py -v

  # ──────────────────────────────────────────────
  # Job 2 — Deploy to Render
  # Only runs on direct pushes to main (not PRs)
  # Only runs if build-and-test passes
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          echo "Triggering Render deployment..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo ""
          echo "Deploy hook fired successfully."

      - name: Deployment summary
        run: |
          echo "================================"
          echo "  Deployment Summary"
          echo "================================"
          echo "Branch:  ${{ github.ref_name }}"
          echo "Commit:  ${{ github.sha }}"
          echo "Author:  ${{ github.actor }}"
          echo "Status:  Deploy hook triggered"
          echo "================================"